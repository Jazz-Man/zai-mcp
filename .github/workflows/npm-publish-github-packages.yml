# This workflow will build and publish a package to GitHub Packages when a release is created
# For more information see: https://docs.github.com/en/packages/working-with-a-github-packages-registry/working-with-the-npm-registry

name: Publish to GitHub Packages

on:
  push:
    branches:
      - main
  release:
    types: [created]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Configure Bun for GitHub Packages
        run: |
          mkdir -p ~/.bun
          echo "@jazz-man:registry=https://npm.pkg.github.com" > ~/.bun/.npmrc
          echo "//npm.pkg.github.com/:_authToken=\${GITHUB_TOKEN}" >> ~/.bun/.npmrc

      - name: Install dependencies
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun install --frozen-lockfile

      - name: Build binary
        run: bun run build:bin

      - name: Publish to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun publish
