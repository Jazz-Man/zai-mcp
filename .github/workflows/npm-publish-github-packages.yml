# This workflow will build and publish a package to GitHub Packages
# For more information see: https://docs.github.com/en/packages/working-with-a-github-packages-registry/working-with-the-npm-registry

name: Publish to GitHub Packages

on:
  push:
    branches:
      - main

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Configure Bun for GitHub Packages
        run: |
          mkdir -p ~/.bun
          echo "@jazzman:registry=https://npm.pkg.github.com" > ~/.bun/.npmrc
          echo "//npm.pkg.github.com/:_authToken=\${GITHUB_TOKEN}" >> ~/.bun/.npmrc

      - name: Install dependencies
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun install --frozen-lockfile

      - name: Build binary
        run: bun run build:bin

      - name: Bump version and publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Get commit hash (short)
          COMMIT_HASH=$(git rev-parse --short HEAD)
          
          # Get commit timestamp
          COMMIT_DATE=$(git log -1 --format=%ct HEAD)
          COMMIT_DATETIME=$(date -r $COMMIT_DATE +%Y%m%d.%H%M%S)
          
          # Create new version: 1.0.0.{date}.{hash}
          NEW_VERSION="1.0.0.${COMMIT_DATETIME}.${COMMIT_HASH}"
          
          # Update package.json version
          npm version $NEW_VERSION --no-git-tag-version
          
          # Publish to GitHub Packages with --tolerate-republish to avoid errors on re-runs
          bun publish --tolerate-republish
